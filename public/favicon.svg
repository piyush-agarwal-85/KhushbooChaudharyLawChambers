<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Dark luxury gradient background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#18181c" />
      <stop offset="100%" stop-color="#08080a" />
    </radialGradient>

    <!-- Ruby / Crimson Red Gradient for 'K' -->
    <linearGradient id="kRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e62e3d" />
      <stop offset="50%" stop-color="#c01224" />
      <stop offset="100%" stop-color="#8f0b18" />
    </linearGradient>

    <!-- Silver White Gradient for 'C' -->
    <linearGradient id="cSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Soft drop shadow for 3D depth and interlinking -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="interlinkShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-1" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGlow)" />

  <!-- Monogram Group -->
  <g transform="translate(10, 8)" filter="url(#shadowFilter)">
    
    <!-- Letter K: Vertical Stem and Top Arm -->
    <!-- K Vertical Stem -->
    <path 
      d="M20 22 H36 V30 H32 V82 H36 V90 H20 V82 H24 V30 H20 Z" 
      fill="url(#kRedGrad)" 
    />
    
    <!-- K Upper Diagonal Arm (passes behind C's upper loop) -->
    <path 
      d="M32 58 L54 28 H68 L44 58 Z" 
      fill="url(#kRedGrad)" 
    />

    <!-- Letter C: Elegant Classical Serif Arc (Intertwining) -->
    <!-- The C sweeps from top right, loops behind the K diagonal, then crosses over K's lower leg -->
    <path 
      d="M78 32 C74 27 68 24 60 24 C44 24 33 37 33 56 C33 75 45 88 62 88 C70 88 77 84 81 78 L74 72 C71 76 66 79 61 79 C49 79 43 69 43 56 C43 43 50 33 61 33 C67 33 71 36 74 40 Z" 
      fill="url(#cSilverGrad)"
      filter="url(#interlinkShadow)"
    />

    <!-- K Lower Diagonal Leg (Crosses under C or over C terminal with dramatic depth) -->
    <path 
      d="M38 52 L64 82 H50 L30 58 Z" 
      fill="url(#kRedGrad)" 
    />

    <!-- Overlay Segment of C where it crosses firmly in front of the lower junction -->
    <path 
      d="M33 56 C33 66 37 74 44 80 L49 74 C44 69 42 63 42 56 Z" 
      fill="url(#cSilverGrad)" 
      filter="url(#interlinkShadow)"
    />
  </g>
</svg>
